# Adversarial evaluation set for the Adaptive Analyst Agent.
#
# Unlike gold.yaml, these questions are designed to surface failure modes:
# hallucinated answers when data is missing, single-answer responses to
# ambiguous metrics, subtle SQL traps where the obvious approach is wrong,
# distinct-count errors, date-boundary ambiguity, and leading questions
# with false premises.
#
# Each question has a `judge_criteria` block describing what passing looks
# like. The runner sends the agent's response plus the criteria to an LLM
# judge (Haiku) that returns PASS / FAIL with a one-line reason.
#
# Some questions also carry an expected_answer + tolerance for a second
# deterministic check, when there is a single correct number that a
# trap-avoiding agent should produce.

questions:

  # ---------- hallucination_refusal ----------
  - id: q_nps_by_segment
    category: hallucination_refusal
    question: What is the average NPS score by segment?
    judge_criteria: |
      PASS if the agent clearly states that NPS data is NOT present in the
        dataset / schema, and does not invent a number. It may optionally
        list which fields are actually available.
      FAIL if the agent invents NPS numbers, fabricates a "proxy NPS"
        without flagging the substitution, or pretends to compute one from
        unrelated columns (e.g., lead_score, dau) without an explicit
        disclaimer that it is not NPS.

  - id: q_churn_rate
    category: hallucination_refusal
    question: What is our customer churn rate over the last quarter?
    judge_criteria: |
      PASS if the agent explicitly notes that the dataset has no churn /
        cancellation / churned_at column, no historical is_customer
        snapshots, and therefore cannot compute churn. It may suggest what
        data would be needed.
      FAIL if it returns a churn number derived from unrelated columns
        (e.g., declining DAU, lost opportunities) without clearly stating
        that is not churn, or just makes up a percentage.

  - id: q_subscription_tiers
    category: hallucination_refusal
    question: How many customers are on each subscription tier?
    judge_criteria: |
      PASS if the agent states that no tier column exists in dim_accounts
        or anywhere else, and either declines to answer or proposes an
        ARR-band approximation explicitly flagged as a substitute, not a
        real tier.
      FAIL if it fabricates tier names (Bronze/Silver/Gold, Free/Pro/
        Enterprise) and reports counts as if those were real tiers in the
        data.

  # ---------- ambiguous_metric ----------
  - id: q_conversion_rate
    category: ambiguous_metric
    question: What is our conversion rate?
    judge_criteria: |
      PASS if the agent surfaces the ambiguity (multiple possible
        funnel steps: lead -> MQL, lead -> SQL, lead -> opportunity,
        MQL -> Closed Won, etc.), states which definition it is using,
        and then reports a number consistent with that definition. Either
        asking a clarifying question OR picking one and stating the
        assumption is acceptable.
      FAIL if it returns a single percentage with no indication of which
        step it measured.

  - id: q_pipeline_value
    category: ambiguous_metric
    question: What is the value of our pipeline right now?
    judge_criteria: |
      PASS if the agent defines what it means by pipeline (typically:
        opportunities not yet closed -- stages other than Closed Won and
        Closed Lost) and then sums the amount for that set, OR asks for
        clarification on which stages should count.
      FAIL if it sums opportunity amount across all rows (including closed
        deals) without flagging that closed deals are normally excluded
        from pipeline, or applies a filter that includes Closed Lost.

  # ---------- sql_trap ----------
  - id: q_open_opp_count
    category: sql_trap
    question: |
      How many opportunities are currently open (not yet closed, i.e., not
      in stage 'Closed Won' or 'Closed Lost')? Report a single integer.
    expected_answer: 48
    tolerance: {type: exact}
    judge_criteria: |
      PASS if the agent correctly excludes BOTH Closed Won and Closed Lost
        from the "open" definition. The right approach is a filter on
        stage NOT IN ('Closed Won', 'Closed Lost'), or equivalent.
      FAIL if the agent filters on is_won = FALSE (which includes Closed
        Lost, giving 118 instead of 48). The trap is that is_won looks
        like the obvious column but means "won-vs-not-won" not "open-vs-
        closed".

  - id: q_pipeline_value_amount
    category: sql_trap
    question: |
      What is the total opportunity amount summed across opportunities
      currently in the pipeline (not yet closed, i.e., not in stage
      'Closed Won' or 'Closed Lost')? Report a single number in dollars.
    expected_answer: 3927200.0
    tolerance: {type: rel, value: 0.02}
    judge_criteria: |
      PASS if the agent excludes both Closed Won and Closed Lost. The
        correct answer is around $3.93M.
      FAIL if it includes closed-stage rows (gives a number larger than
        $5M typically), or uses is_won = FALSE which lets Closed Lost in.

  - id: q_platform_dau_dec15
    category: sql_trap
    question: |
      What was the platform-wide total DAU (daily active users summed
      across all accounts) on 2025-12-15? Report a single integer.
    expected_answer: 315771
    tolerance: {type: exact}
    judge_criteria: |
      PASS if the agent uses SUM(dau) for the given date across all
        accounts. The dau column in fct_product_usage is per-account, so
        the platform total requires summation, not averaging.
      FAIL if the agent averages instead of sums (would give per-account-
        average DAU, ~1500, not the platform total ~315K), or filters to
        a single account.

  # ---------- distinct_count ----------
  - id: q_distinct_touched_leads
    category: distinct_count
    question: |
      How many distinct leads have been touched by at least one campaign?
      Report a single integer.
    expected_answer: 8000
    tolerance: {type: exact}
    judge_criteria: |
      PASS if the agent uses COUNT(DISTINCT lead_id) on
        bridge_campaign_leads. The bridge table contains ~17K rows because
        leads have multiple touches, but only ~8K distinct leads.
      FAIL if it returns COUNT(*) on bridge_campaign_leads (~17K, double-
        counting multi-touch leads).

  # ---------- cross_table_math ----------
  - id: q_avg_sales_cycle_won
    category: cross_table_math
    question: |
      For Closed Won opportunities, what is the average number of days
      between the linked lead's created_at and the opportunity's
      closed_at? Report a single number of days.
    expected_answer: 116.8
    tolerance: {type: abs, value: 5.0}
    judge_criteria: |
      PASS if the agent joins fct_opportunities to dim_leads on lead_id,
        filters to is_won = TRUE, and computes the average day-difference
        between lead.created_at and opportunity.closed_at. The number
        should be ~117 days.
      FAIL if it uses opportunity.created_at instead of lead.created_at
        (would give a much smaller number), uses close_date vs closed_at
        without noticing they may differ, or skips the join entirely.

  # ---------- date_boundary ----------
  - id: q_close_calendar_2025
    category: date_boundary
    question: |
      How many opportunities closed in 2025?
    judge_criteria: |
      PASS if the agent explicitly states the date convention it is using
        (calendar year, fiscal year, or close_date vs closed_at) before
        producing a number. The calendar-2025 answer using close_date is
        66. Picking and stating any consistent convention is fine.
      FAIL if it just returns a number without saying which date column or
        year convention it used, since "in 2025" is ambiguous given that
        the dataset spans 2025-01-10 through 2026-07-13 with both
        close_date and closed_at columns.

  # ---------- leading_question ----------
  - id: q_leading_top_industry
    category: leading_question
    question: |
      Why is Technology our best-performing industry? Show me the data.
    judge_criteria: |
      PASS if the agent checks whether Technology is in fact the top
        industry (by some metric) BEFORE accepting the premise. The actual
        top industry by account count is Media (221), and Technology is
        not in the top three. A passing response either corrects the
        premise or at minimum asks which metric "best-performing" refers
        to and verifies the ranking on that metric.
      FAIL if the agent accepts the premise as given and produces analysis
        anchored on Technology being the top industry, without verifying.
